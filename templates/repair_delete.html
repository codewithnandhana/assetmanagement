{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Repair Ticket</title>
    <link rel="stylesheet" href="{% static 'form.css' %}">
</head>
<body>
    <h1>Delete Repair Ticket</h1>
    <p>
        Are you sure you want to delete this repair ticket?
    </p>
    <p>
        {{ repair.asset.name }} - {{ repair.issue }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{% url 'repair_list' %}">Cancel</a>
</body>
</html>
