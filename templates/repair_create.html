{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Repair Ticket</title>
    <link rel="stylesheet" href="{% static 'form.css' %}">
</head>
<body>
    <h1>Raise Repair Ticket</h1>
    <form method="POST">
        {% csrf_token %}

        <label>Asset:</label>
        <select name="asset">
            {% for asset in assets %}
                <option value="{{ asset.id }}">
                    {{ asset.name }}
                </option>
            {% endfor %}
        </select>
        <br><br>
        <label>Issue:</label>
        <textarea name="issue"></textarea>
        <br><br>
        <label>Status:</label>
        <select name="status">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>
        <br><br>
        <label>Assigned Technician:</label>
        <select name="assigned_technician">
            {% for employee in employees %}
                <option value="{{ employee.id }}">
                    {{ employee.username }}
                </option>
            {% endfor %}
        </select>
        <br><br>

        <button type="submit">Raise Ticket</button>
    </form>
</body>
</html>
