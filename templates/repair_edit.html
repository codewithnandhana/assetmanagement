{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Repair Ticket</title>
    <link rel="stylesheet" href="{% static 'form.css' %}">
</head>
<body>
    <h1>Edit Repair Ticket</h1>
    <form method="POST">
        {% csrf_token %}

        <label>Asset:</label>
        <select name="asset">
            {% for asset in assets %}
                <option value="{{ asset.id }}"
                    {% if asset.id == repair.asset.id %}selected{% endif %}>
                    {{ asset.name }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Issue:</label>
        <textarea name="issue">{{ repair.issue }}</textarea>
        <br><br>

        <label>Status:</label>
        <select name="status">
            <option value="Pending" {% if repair.status == "Pending" %}selected{% endif %}>Pending</option>
            <option value="In Progress" {% if repair.status == "In Progress" %}selected{% endif %}>In Progress</option>
            <option value="Completed" {% if repair.status == "Completed" %}selected{% endif %}>Completed</option>
        </select>
        <br><br>

        <label>Assigned Technician:</label>
        <select name="assigned_technician">
            {% for employee in employees %}
                <option value="{{ employee.id }}"
                    {% if employee.id == repair.assigned_technician.id %}selected{% endif %}>
                    {{ employee.username }}
                </option>
            {% endfor %}
        </select>
        <br><br>
        <button type="submit">Update Ticket</button>
    </form>
</body>
</html>
