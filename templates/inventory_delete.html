{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Inventory</title>
    <link rel="stylesheet" href="{% static 'form.css' %}">
</head>
<body>
    <h1>Delete Inventory Item</h1>
    <p>Are you sure you want to delete {{ item.item_type }}?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{% url 'inventory_list' %}">Cancel</a>
</body>
</html>
